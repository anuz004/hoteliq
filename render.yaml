services:
  - type: web
    name: hoteliq-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hoteliq-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: hoteliq-web
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: hoteliq-db
    plan: free